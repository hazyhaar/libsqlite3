name: Test SEH Windows Server (2022 & 2025)

'on':
  push:
    branches:
      - main
      - 'test/**'
  workflow_dispatch:

jobs:
  test-seh-windows-server:
    strategy:
      matrix:
        os: [windows-2022, windows-2025]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print Windows Server System Info
        shell: powershell
        run: |
          Write-Host "=== Windows Environment Details ==="
          [System.Environment]::OSVersion
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber, OsHardwareAbstractionLayer | Format-List

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Go Environment
        shell: powershell
        run: |
          go version
          go env

      - name: Run TestSEH (issue #221 verification)
        shell: powershell
        run: |
          Write-Host "Running: go test -run TestSEH -v ."
          go test -run TestSEH -v . | Tee-Object -FilePath "test_seh_${{ matrix.os }}.log"

      - name: Upload Test Output Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-seh-${{ matrix.os }}-log
          path: test_seh_${{ matrix.os }}.log
